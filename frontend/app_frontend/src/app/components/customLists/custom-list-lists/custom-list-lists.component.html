<div class="d-flex flex-row gap-5">
  <a [routerLink]="['/Mis-Listas/detail', customList.id]" class="custom-list-name">
    {{ customList.nombre }}</a
  >
  <button mat-button [matMenuTriggerFor]="menu">
    <mat-icon class="align-middle">more_horiz</mat-icon>
  </button>
  <mat-menu class="mt-2" #menu="matMenu">
    <button (click)="deleteListEvent()" mat-menu-item>Eliminar <mat-icon>delete</mat-icon></button>
    <button mat-menu-item>
      <a
        [routerLink]="['/Mis-Listas/detail', customList.id, 'edit']"
        class="custom-list-name bg-transparent"
        >Editar</a
      >
      <mat-icon>edit</mat-icon>
    </button>
  </mat-menu>
</div>
