<div class="custom-list-grid">
  <a href="/Mis-Listas/" class="previous-link"><mat-icon>arrow_back</mat-icon></a>
  <div>
    <h3>Nombre</h3>
    <label>{{ customList.nombre }}</label>
  </div>
  <div>
    <h3>Videojuegos</h3>
    <div class="game-grid">
      @for (videogame of videogames; track videogame.id) {
        <a [routerLink]="['/detail', videogame.id]" class="game-card">
          <img src="{{ videogame.imagen }}" />
        </a>
      }
    </div>
  </div>
</div>
